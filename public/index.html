<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <header class="chat-header">
        <div class="header-row">
          <h1>Realtime Chat</h1>
          <button id="themeToggleBtn" type="button" class="theme-toggle">Switch Theme</button>
        </div>
      </header>

      <section id="authPanel" class="auth-panel">
        <div class="auth-layout">
          <div class="auth-left">
            <h2>Sign in or create account</h2>
            <form id="authForm" class="auth-form">
              <input id="authUsername" placeholder="Username" maxlength="32" required />
              <input id="authPassword" type="password" placeholder="Password (6+ chars)" minlength="6" required />
              <div class="auth-actions">
                <button type="submit" data-mode="login">Login</button>
                <button type="button" id="registerBtn">Register</button>
              </div>
              <p id="authStatus" class="status-line"></p>
            </form>
            <form id="resetRequestForm" class="auth-form">
              <h3>Password reset</h3>
              <input id="resetUsername" placeholder="Username for reset" maxlength="32" />
              <button type="submit">Request reset token</button>
              <input id="resetToken" placeholder="Reset token" />
              <input id="resetNewPassword" type="password" placeholder="New password (6+ chars)" minlength="6" />
              <button id="resetConfirmBtn" type="button">Confirm reset</button>
              <p id="resetStatus" class="status-line"></p>
            </form>
          </div>
          <aside class="auth-brand" aria-label="Brand panel">
            <div class="logo-badge" aria-hidden="true">
              <span class="logo-dot"></span>
              <span class="logo-dot"></span>
              <span class="logo-dot"></span>
            </div>
            <h3 class="brand-title">Realtime Chat</h3>
            <p class="brand-text">A cozy place for rooms, private chats, and instant connection.</p>
            <ul class="brand-points">
              <li>Fast, private, and secure messaging</li>
              <li>Theme-friendly and mobile-ready</li>
              <li>Built for teams, friends, and communities</li>
            </ul>
          </aside>
        </div>
      </section>

      <section id="chatPanel" class="chat-panel hidden">
        <div class="toolbar">
          <div class="row between">
            <span id="currentUser"></span>
            <button id="logoutBtn" type="button">Logout</button>
          </div>
          <div class="row">
            <input id="roomInput" value="general" maxlength="64" />
            <button id="joinRoomBtn" type="button">Join room</button>
          </div>
          <div class="row">
            <label for="privateTo">Send to</label>
            <select id="privateTo">
              <option value="">Room (public)</option>
            </select>
            <button id="loadPrivateHistoryBtn" type="button">Load PM history</button>
          </div>
          <p id="chatStatus" class="status-line"></p>
        </div>

        <ul id="messages" class="messages"></ul>

        <form id="form" class="composer">
          <input id="input" placeholder="Type a message..." autocomplete="off" maxlength="250" required />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./client.js"></script>
  </body>
</html>
